services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cycletracker
      POSTGRES_USER: cycletracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cycletracker"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      target: api
    environment: &environment
      NODE_ENV: production
      APP_URL: ${APP_URL:?Set HTTPS APP_URL}
      DATABASE_URL: postgres://cycletracker:${POSTGRES_PASSWORD}@database:5432/cycletracker
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set random BETTER_AUTH_SECRET}
      DOCUMENT_DIR: /data/documents
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
    volumes:
      - documents:/data/documents
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3100/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    build:
      context: .
      target: api
    command: [pnpm, worker]
    environment: *environment
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
    ports: ["127.0.0.1:4180:80"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  database:
  documents:
